name: Notify website of new runs

# Seint djangodevreng.nl in zodra er meetdata op main landt. Daar draait dan
# scripts/import-benchmarks.mjs en verschijnt een PR met de nieuwe cijfers.
#
# Waarom een aparte PAT en niet de standaard GITHUB_TOKEN: die is gebonden aan
# deze repo en mag geen workflow in een andere repo starten. WEBSITE_DISPATCH_TOKEN
# is een fine-grained PAT met alleen Contents: read-and-write op djangodevreng.nl.
#
# Zonder dat secret faalt deze workflow zichtbaar maar breekt er verder niets:
# de site heeft een wekelijks vangnet en een handmatige knop.

on:
  push:
    branches: [main]
    # Alleen als er echt meetdata verandert. Een commit in README of INDEX
    # hoeft de site niet wakker te maken.
    paths:
      - "results/**"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Signaal sturen
        env:
          TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::WEBSITE_DISPATCH_TOKEN ontbreekt. Zie de kop van dit bestand."
            exit 1
          fi
          code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/djangodevreng/djangodevreng.nl/dispatches \
            -d '{"event_type":"benchmarks-updated"}')
          if [ "$code" = "204" ]; then
            echo "Signaal verstuurd; de site opent zo een PR."
          else
            echo "::error::GitHub gaf HTTP $code"; cat /tmp/resp.txt; exit 1
          fi
